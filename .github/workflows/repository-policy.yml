# Portable PR checks run once; full platform qualification is deliberate.
name: Repository policy

on:
  pull_request:
    branches:
    - main
  workflow_dispatch:
    inputs:
      full:
        description: Run complete platform and release qualification (prefer local execution)
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    name: Repository policy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: Validate organization profile policy
        run: |
          test -s LICENSE
          test -s .github/CODEOWNERS
          grep -Fq '* @emeisazam' .github/CODEOWNERS
          test -s profile/README.md
